        costCents: {type: integer, format: int64}
        incomeCents: {type: integer, format: int64}
        resultCents: {type: integer, format: int64}
        breakEvenCents: {type: integer, format: int64, nullable: true}
    EventBudgetDay:
      type: object
      required: [day, totals]
      properties:
        day: {type: string}
        totals: {$ref: "#/components/schemas/EventBudgetTotals"}
    EventBudgetDetail:
      type: object
      required: [id, name, startsOn, endsOn, archived, lines, totals, days]
      properties:
        id: {type: string}
        name: {type: string}
        startsOn: {type: string}
        endsOn: {type: string}
        archived: {type: boolean}
        lines:
          type: array
          items: {$ref: "#/components/schemas/EventBudgetLine"}
        totals: {$ref: "#/components/schemas/EventBudgetTotals"}
        days:
          type: array
          items: {$ref: "#/components/schemas/EventBudgetDay"}
    EventBudgetLineInput:
      type: object
      additionalProperties: false
      required: [kind, description]
      properties:
        kind: {type: string, description: "cost, ticket, foodtruck, sponsor or due"}
        description: {type: string}
        headingId: {type: string}
        contactId: {type: string}
        referencePriceId: {type: string}
        quantity: {type: integer, format: int64}
        unitAmountCents: {type: integer, format: int64}
        day: {type: string}
    EventBudgetLine:
      type: object
      required: [id, kind, description]
      properties:
        id: {type: string}
        kind: {type: string}
        description: {type: string}
        headingId: {type: string}
        contactId: {type: string}
        quantity: {type: integer, format: int64}
        unitAmountCents: {type: integer, format: int64}
        day: {type: string}
    EventBudgetInput:
      type: object
      additionalProperties: false
      required: [name, startsOn, endsOn]
      properties:
        name: {type: string}
        startsOn: {type: string}
        endsOn: {type: string}
    EventBudget:
      type: object
      required: [id, name, startsOn, endsOn, archived]
      properties:
        id: {type: string}
        name: {type: string}
        startsOn: {type: string}
        endsOn: {type: string}
        archived: {type: boolean}
    NewFinanceCategory:
      type: object
      additionalProperties: false
      required: [name, direction]
      properties:
        name: { type: string }
        direction: { type: string, enum: [income, expense] }
    RenameFinanceCategory:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
    FinanceCategory:
      type: object
      required: [id, name, direction, active, reserved]
      properties:
        id: { type: string }
        name: { type: string }
        direction: { type: string }
        active: { type: boolean }
        reserved: { type: boolean }
    NewFinanceEntry:
      type: object
      additionalProperties: false
      required: [categoryId, direction, date, amountCents, description]
      properties:
        categoryId: { type: string }
        direction: { type: string }
        date: { type: string }
        amountCents: { type: integer, format: int64 }
        description: { type: string }
    FinanceEntry:
      type: object
      required: [id, categoryId, direction, date, amountCents, description, recordedBy, recordedAt, hasReceipt]
      properties:
        id: { type: string }
        categoryId: { type: string }
        direction: { type: string }
        date: { type: string }
        amountCents: { type: integer, format: int64 }
        description: { type: string }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        hasReceipt:
          type: boolean
          description: True when at least one Receipt backs this entry.
        reversesId:
          type: string
          description: Present when this entry is a Reversal; the id of the entry it reverses.
        reversalId:
          type: string
          description: Present when this entry was reversed; the id of its Reversal.
        reversedBy:
          type: string
          description: Present when this entry was reversed; the Roster name of the officer who reversed it.
        reversedOn:
          type: string
          description: Present when this entry was reversed; the Reversal's date (YYYY-MM-DD, Argentina).
        rosterMember:
          $ref: "#/components/schemas/FinanceEntryRosterMember"
    FinanceEntryRosterMember:
      type: object
      description: >
        Present on a due payment's Entry for officers, school admins and veedors; absent for students
        (ADR 0004).
      required: [id, fullName]
      properties:
        id: { type: string }
        fullName: { type: string }
    FinanceReceipt:
      type: object
      required: [id, contentType, sizeBytes, uploadedAt]
      properties:
        id: { type: string }
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }
    FinanceCategoryTotal:
      type: object
      required: [categoryId, name, direction, totalCents]
      properties:
        categoryId: { type: string }
        name: { type: string }
        direction: { type: string, enum: [income, expense] }
        totalCents:
          type: integer
          format: int64
          description: Signed net of the Category's Entries in the range (income +, expense −); a Reversal counts with the opposite sign.
    FinanceReport:
      type: object
      required: [from, to, openingCents, closingCents, incomeCents, expenseCents, totals, entries]
      properties:
        from: { type: string, description: "YYYY-MM-DD, inclusive." }
        to: { type: string, description: "YYYY-MM-DD, inclusive." }
        openingCents: { type: integer, format: int64, description: Balance of every Entry dated before `from`. }
        closingCents: { type: integer, format: int64, description: openingCents + incomeCents + expenseCents. }
        incomeCents: { type: integer, format: int64, description: Sum of the income Categories' totals. }
        expenseCents: { type: integer, format: int64, description: Sum of the expense Categories' totals (zero or negative unless reversed). }
        totals:
          type: array
          description: Categories with Entries in the range; income first, then by name.
          items: { $ref: "#/components/schemas/FinanceCategoryTotal" }
        entries:
          type: array
          description: Entries in the range, oldest first.
          items: { $ref: "#/components/schemas/FinanceEntry" }
    FinanceBalance:
      type: object
      required: [balanceCents]
      properties:
        balanceCents: { type: integer, description: "The exact sum; may exceed int64." }
    NewFinanceDue:
      type: object
      additionalProperties: false
      required: [name, amountCents, dueDate]
      properties:
        name: { type: string }
        amountCents: { type: integer, format: int64 }
        dueDate: { type: string }
    UpdateFinanceDue:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        amountCents: { type: integer, format: int64 }
        dueDate: { type: string }
    NewFinanceDueExemption:
      type: object
      additionalProperties: false
      required: [rosterMemberId, reason]
      properties:
        rosterMemberId: { type: string }
        reason: { type: string, description: "Trimmed; 1 to 500 characters." }
    FinanceDueStatus:
      type: string
      enum: [owing, paid, exempt]
    FinanceDueMember:
      type: object
      required: [rosterMemberId, fullName, status, paidCents]
      properties:
        rosterMemberId: { type: string }
        fullName: { type: string }
        paidCents:
          type: integer
          format: int64
          description: Sum of the member's payments whose Entry has not been reversed.
        status:
          $ref: "#/components/schemas/FinanceDueStatus"
        exemptionReason:
          type: string
          description: Present only when status is `exempt`. Only officers, school admins and veedors read the due detail.
    FinanceDueSummary:
      type: object
      required: [id, name, amountCents, dueDate, createdAt, owingCount, totalCount]
      properties:
        id: { type: string }
        name: { type: string }
        amountCents: { type: integer, format: int64 }
        dueDate: { type: string }
        createdAt: { type: string, format: date-time }
        owingCount: { type: integer, description: "Members who owe; exempt members are left out." }
        totalCount: { type: integer, description: "Members in the snapshot minus exempt members (the denominator)." }
    FinanceDueDetail:
      type: object
      required: [id, name, amountCents, dueDate, createdAt, owingCount, totalCount, members]
      properties:
        id: { type: string }
        name: { type: string }
        amountCents: { type: integer, format: int64 }
        dueDate: { type: string }
        createdAt: { type: string, format: date-time }
        owingCount: { type: integer, description: "Members who owe; exempt members are left out." }
        totalCount: { type: integer, description: "Members in the snapshot minus exempt members (the denominator)." }
        members:
          type: array
          items:
            $ref: "#/components/schemas/FinanceDueMember"
    MyFinanceDue:
      type: object
      required: [id, name, amountCents, dueDate, status, paidCents]
      properties:
        id: { type: string }
        name: { type: string }
        amountCents: { type: integer, format: int64 }
        paidCents:
          type: integer
          format: int64
          description: Sum of the caller's payments whose Entry has not been reversed.
        dueDate: { type: string }
        status:
          $ref: "#/components/schemas/FinanceDueStatus"
    NewFinanceDuePayment:
      type: object
      additionalProperties: false
      required: [rosterMemberId, amountCents, date]
      properties:
        rosterMemberId: { type: string }
        amountCents: { type: integer, format: int64 }
        date: { type: string, description: "Payment date (YYYY-MM-DD), not in the future in Argentina." }
    FinanceDuePayment:
      type: object
      required: [id, dueId, rosterMemberId, entryId, amountCents, date]
      properties:
        id: { type: string }
        dueId: { type: string }
        rosterMemberId: { type: string }
        entryId: { type: string }
        amountCents: { type: integer, format: int64 }
        date: { type: string }
    ForbiddenError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [forbidden, mfa_required]
    NotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [not_found]
    CommissionMember:
      type: object
      required: [rosterMemberId, fullName]
      properties:
        rosterMemberId:
          type: string
        fullName:
          type: string
    ElectoralCommission:
      type: object
      description: The Electoral commission (UI "Centro de estudiantes").
      required: [id, createdAt, members]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          description: Ordered by name.
          items:
            $ref: "#/components/schemas/CommissionMember"
    ElectoralCommissionStatus:
      type: object
      required: [commission, isMember, canDesignate]
      properties:
        commission:
          allOf:
            - $ref: "#/components/schemas/ElectoralCommission"
          nullable: true
          description: The current commission; null when none was designated.
        isMember:
          type: boolean
          description: The caller's roster entry is on the current commission.
        canDesignate:
          type: boolean
          description: The caller's role allows designating or replacing the commission now.
    CommissionDesignation:
      type: object
      additionalProperties: false
      properties:
        rosterMemberIds:
          type: array
          description: Roster member ids; at least one (`empty_commission` otherwise), repeats count once.
          items:
            type: string
    ElectionMode:
      type: string
      enum: [secret]
      description: Only "Voto secreto"; any other value is 422 `mode_not_supported`.
    ElectionState:
      type: string
      enum: [draft, submission, scheduled, open, closed, annulled]
      description: >
        `annulled` once the election was annulled, whatever the clock says. Otherwise computed from the server
        clock against the dates; every window includes its start and excludes its end.
        `draft` before `submissionStartsAt`, `submission` until `submissionEndsAt`, `scheduled` until `startsAt`,
        `open` until `endsAt`, `closed` from `endsAt` on.
    VoteRequest:
      type: object
      additionalProperties: false
      properties:
        choice:
          type: string
          nullable: true
          description: >
            The id of an approved list of the election, or `blank` for a Blank vote. Missing, null or empty answers
            `invalid_choice`.
    Turnout:
      type: object
      required: [voted, electorate, hasVoted]
      properties:
        voted:
          type: integer
          description: How many students of the Electorate voted (X).
        electorate:
          type: integer
          description: The size of the Electorate, taken when voting opened (Y).
        hasVoted:
          type: boolean
          description: Whether the caller voted; nobody learns whether anyone else did.
    AnnulmentRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: >
            Public: every member of the school sees it next to the election. Trimmed; 1 to 500 characters once trimmed
            (`reason_required`, `reason_too_long`). The request body is capped at 4 KiB (`bad_request`).
    Annulment:
      type: object
      required: [reason, annulledAt]
      properties:
        reason:
          type: string
        annulledAt:
          type: string
          format: date-time
    ElectionDraftRequest:
      type: object
      additionalProperties: false
      required: [name, submissionStartsAt, submissionEndsAt, startsAt, endsAt]
      description: >
        Date-times are RFC 3339 with offset (Argentina is -03:00). `submissionEndsAt` is exclusive: a period
        "1 to 5 March" ends at 2027-03-06T00:00:00-03:00. The four dates are whole minutes (no seconds): one
        with seconds or a fraction of a second is rejected with its field's code. Validation codes are listed in
        the 422 response.
      properties:
        name:
          type: string
          maxLength: 120
        mode:
          allOf:
            - $ref: "#/components/schemas/ElectionMode"
          description: Defaults to `secret` when absent.
        submissionStartsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_submission_period`.
        submissionEndsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_submission_period`.
        startsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_window`.
        endsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_window`.
        positions:
          type: array
          description: >
            Positions in order. When absent the election gets "Presidente", "Vicepresidente", "Secretario",
            "Tesorero".
          items:
            type: string
            maxLength: 120
    Election:
      type: object
      required: [id, name, mode, submissionStartsAt, submissionEndsAt, startsAt, endsAt, positions, state, commission]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          $ref: "#/components/schemas/ElectionMode"
        submissionStartsAt:
          type: string
          format: date-time
        submissionEndsAt:
          type: string
          format: date-time
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        positions:
          type: array
          description: In order.
          items:
            type: string
        state:
          $ref: "#/components/schemas/ElectionState"
        annulment:
          allOf:
            - $ref: "#/components/schemas/Annulment"
          description: >
            Present only when the election was annulled: its public reason. An annulled election carries no vote
            counts.
        commission:
          type: array
          description: Members of the election's Electoral commission, ordered by name.
          items:
            $ref: "#/components/schemas/CommissionMember"
    ElectionListStatus:
      type: string
      enum: [pending, approved, rejected]
    ListCandidateInput:
      type: object
      additionalProperties: false
      required: [position, rosterMemberId]
      properties:
        position:
          type: string
        rosterMemberId:
          type: string
    ElectionListRequest:
      type: object
      additionalProperties: false
      required: [name, candidates]
      properties:
        name:
          type: string
          maxLength: 80
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ListCandidateInput"
    CommissionElectionListRequest:
      type: object
      additionalProperties: false
      required: [name, representativeRosterMemberId, candidates]
      properties:
        name:
          type: string
          maxLength: 80
        representativeRosterMemberId:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ListCandidateInput"
    RejectListRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
    ListCandidate:
      type: object
      required: [position, rosterMemberId, fullName]
      properties:
        position:
          type: string
        rosterMemberId:
          type: string
        fullName:
          type: string
    ElectionList:
      type: object
      required: [id, electionId, name, status, rejectionReason, representativeRosterMemberId, representativeFullName, candidates, reviewedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        electionId:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/ElectionListStatus"
        rejectionReason:
          type: string
          nullable: true
        representativeRosterMemberId:
          type: string
        representativeFullName:
          type: string
        candidates:
          type: array
          description: Ordered by the election's positions.
          items:
            $ref: "#/components/schemas/ListCandidate"
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ElectionListsResponse:
      type: object
      required: [rosterMemberId, lists]
      properties:
        rosterMemberId:
          type: string
          nullable: true
        lists:
          type: array
          items:
            $ref: "#/components/schemas/ElectionList"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    ClaimRequest:
      type: object
      required: [code, email, password]
      additionalProperties: false
      properties:
        code:
          type: string
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The value after `#token=` in the emailed link.
    PasswordResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    RedeemRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    Role:
      type: string
      enum: [school_admin, officer, student]
    MfaState:
      type: string
      enum: [not_required, enrollment_required, pending, satisfied]
      description: >
        Two-factor state of the session, computed from the role in the active tenant. School admins, officers
        and members of the current Electoral commission are privileged. `not_required`: not privileged or no
        membership. `enrollment_required`: privileged without a confirmed TOTP. `pending`: confirmed TOTP but
        this session has not verified it. `satisfied`: this session verified a code. Endpoints for privileged
        users answer 403 `mfa_required` unless `satisfied`.
    MfaEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 (no padding) of the 20-byte secret, for manual entry. Shown once.
        otpauthUri:
          type: string
          description: "`otpauth://totp/Centro%20de%20Estudiantes:<email>?secret=...&issuer=Centro%20de%20Estudiantes&algorithm=SHA1&digits=6&period=30`"
    MfaCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `code` and `recoveryCode`; otherwise 400 `bad_request`.
      properties:
        code:
          type: string
        recoveryCode:
          type: string
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$"
    Me:
      type: object
      required: [userId, email, emailVerified, tenantId, tenantName, role, mfa]
      properties:
        userId:
          type: string
        email:
          type: string
        tenantId:
          type: string
          nullable: true
          description: Active tenant of the session; null whenever `role` is null (no membership there).
        tenantName:
          type: string
          nullable: true
          description: >
            Name of the active tenant's organization, as stored (display it as text); null exactly when
            `tenantId` is null.
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
          description: Role in the active tenant; null when the user has no membership.
        roles:
          type: array
          description: All roles in the active tenant when there is more than one.
          items:
            $ref: "#/components/schemas/Role"
        emailVerified:
          type: boolean
        mfa:
          $ref: "#/components/schemas/MfaState"
    SchoolMember:
      type: object
      required: [email, fullName, rosterMemberId, position, roles]
      properties:
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        rosterMemberId:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    RosterMember:
      type: object
      required: [id, fullName, documentNumber, hasActiveCode, hasAccount]
      properties:
        id:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        hasActiveCode:
          type: boolean
          description: An unused, unrevoked and unexpired access code exists.
        hasAccount:
          type: boolean
    ImportResult:
      type: object
      required: [inserted, skipped]
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
    ImportError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
    RowError:
      type: object
      required: [line, code, reason]
      properties:
        line:
          type: integer
          description: 1-based line of the file (the header is line 1); 0 when unknown.
        code:
          type: string
          description: What is wrong with the line; clients explain it in their own language.
          enum:
            - header_invalid
            - field_count
            - encoding_invalid
            - csv_malformed
            - full_name_required
            - full_name_too_long
            - full_name_invalid
            - full_name_invisible
            - document_number_required
            - document_number_spaces
            - document_number_format
            - document_number_length
            - document_number_duplicate
        reason:
          type: string
          description: The same problem in English, for logs and API users.
        duplicateOfLine:
          type: integer
          description: Only for document_number_duplicate, the line that already has this DNI.
    IssuedCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$"
        expiresAt:
          type: string
          format: date-time
    IssuedMemberCode:
      type: object
      required: [memberId, fullName, documentNumber, code, expiresAt]
      properties:
        memberId:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
    ContactHeading:
