  /roster/access-codes:
    post:
      operationId: postRosterAccessCodes
      summary: Issue codes for every member without an account and without an active code
      description: "School admins with a two-factor session only. Codes are shown once, for printing (`Cache-Control: no-store`)."
      responses:
        "201":
          description: Codes issued, ordered by name; empty when nobody needed one.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssuedMemberCode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /electoral-commission:
    get:
      operationId: getElectoralCommission
      summary: Read the active school's current Electoral commission
      description: >
        Any member of the active school (student, officer or school admin); no second factor needed.
        `commission` is null until one is designated. `isMember` says whether the caller's roster entry sits
        on it; `canDesignate` whether the caller may designate or replace it now by role (any officer when
        the school has officers, otherwise the school admin), regardless of the second factor and of
        `election_frozen`. Responses carry `Cache-Control: no-store`.
      responses:
        "200":
          description: The commission (or null) and the caller's relation to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectoralCommissionStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
    put:
      operationId: putElectoralCommission
      summary: Designate or replace the members of the current Electoral commission
      description: >
        Any officer when the school has officers (an officer position or the officer role); otherwise the
        school admin. Checked on every request, so it applies to replacing too. The role is checked first
        (`forbidden`), then the second factor (`mfa_required`); both before the body is read. Each id is a
        roster member of the active school with an account; a repeated id is stored once. The whole list
        replaces the current members; the commission is created when the school has none. Every error writes
        nothing. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionDesignation"
      responses:
        "200":
          description: The commission as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectoralCommission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            `forbidden` (a student without an officer position, a school admin while the school has officers,
            or no membership) or `mfa_required` (allowed role, session without a verified second factor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: An id is not a roster member of the active school (`not_found`); never says whether it exists elsewhere.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: An election of this commission already opened (`election_frozen`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_frozen]
        "422":
          description: >
            `empty_commission` (the list is empty, null or missing) or `no_account` (a roster member without an
            account).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [empty_commission, no_account]
  /electoral-commission/candidates:
    get:
      operationId: getElectoralCommissionCandidates
      summary: List the roster members who can sit on the Electoral commission
      description: >
        Roster members of the active school with an account, ordered by name. Same permission and order of
        checks as `PUT /electoral-commission` (`forbidden`, then `mfa_required`). Responses carry
        `Cache-Control: no-store`.
      responses:
        "200":
          description: Candidates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` or `mfa_required`, as in `PUT /electoral-commission`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
  /elections:
    post:
      operationId: postElection
      summary: Create the draft of an election
      description: >
        Members of the current Electoral commission only, with a verified second factor (`forbidden` first, then
        `mfa_required`, both before the body is read): students, officers (the Presidente included) and school
        admins who are not on it get `forbidden`. The election belongs to the current commission. Every error
        writes nothing; the validation codes are listed in the 422 response. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionDraftRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` (not on the current Electoral commission) or `mfa_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "409":
          description: >
            The school already has an election neither published nor annulled (`election_in_progress`). Of two
            simultaneous requests exactly one gets 201.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_in_progress]
        "422":
          $ref: "#/components/responses/InvalidElectionDraft"
  /elections/current:
    get:
      operationId: getCurrentElection
      summary: Read the active school's election in progress (neither published nor annulled)
      description: "Any member of the active school. Responses carry `Cache-Control: no-store`."
      responses:
        "200":
          description: The election.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No election in progress (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
  /elections/latest:
    get:
      operationId: getLatestElection
      summary: Read the active school's election in progress, or else its most recently created one
      description: >
        Any member of the active school. The election in progress when there is one (the same as
        `GET /elections/current`); otherwise the most recently created election, so everyone still sees an annulled
        election and its reason. Responses carry `Cache-Control: no-store`.
      responses:
        "200":
          description: The election.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: The school has no election (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
  /elections/{electionId}:
    parameters:
      - name: electionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getElection
      summary: Read an election of the active school
      description: "Any member of the active school. Responses carry `Cache-Control: no-store`."
      responses:
        "200":
          description: The election.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No such election in the active school (`not_found`), whether or not it exists in another.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    put:
      operationId: putElection
      summary: Edit the draft of an election
      description: >
        Same permission and order of checks as `POST /elections`. Replaces name, mode, dates and positions
        while the election is a draft (state `draft`). Every error writes nothing. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionDraftRequest"
      responses:
        "200":
          description: The election as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` (not on the current Electoral commission) or `mfa_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No such election in the active school (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: >
            The election was annulled (`election_annulled`), or it is no longer a draft (`election_not_draft`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_annulled, election_not_draft]
        "422":
          $ref: "#/components/responses/InvalidElectionDraft"
  /elections/{electionId}/annulment:
    parameters:
      - name: electionId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: postElectionAnnulment
      summary: Annul an election before its result is published
      description: >
        Members of the election's Electoral commission only, with a verified second factor. Checks, in order and
        before the body is read: `forbidden` (no membership in the active school), `not_found` (no such election
        in it, whether or not it exists in another), `forbidden` (not on the election's commission: students,
        officers and school admins who are not on it), `mfa_required`. Then the reason (422) and the election's
        state (409). Annulling is irreversible: the election publishes no result, accepts no change and never
        reopens; the commission's mandate ends, so the school can organize another election once the officers
        designate a new commission. Of two simultaneous requests exactly one annuls. Every error writes nothing.
        Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnulmentRequest"
      responses:
        "200":
          description: The election as stored, with state `annulled` and its `annulment`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` (not on the election's Electoral commission) or `mfa_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No such election in the active school (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: >
            The election was already annulled (`election_annulled`; the original reason stays) or its result is
            published: the voting ended (state `closed`) (`election_published`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_annulled, election_published]
        "422":
          description: >
            Nothing was written. `reason_required`: `reason` missing, null, empty or only spaces.
            `reason_too_long`: more than 500 characters once trimmed.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [reason_required, reason_too_long]
  /finance/categories:
    get:
      operationId: getFinanceCategories
      summary: List categories in the active school
      responses:
        "200":
          description: Categories with their directions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceCategory"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: postFinanceCategories
      summary: Add a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFinanceCategory" }
      responses:
        "201":
          description: Created category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Category already exists.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [category_exists]
        "422":
          description: Invalid category input.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [name_required, invalid_category]
  /finance/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      operationId: patchFinanceCategory
      summary: Rename a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameFinanceCategory" }
      responses:
        "200":
          description: Renamed category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Category not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: Duplicate or reserved category.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [category_exists, reserved_category]
        "422":
          description: Category name is required.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [name_required]
    delete:
      operationId: deleteFinanceCategory
      summary: Delete an unused category
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Category not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: Used or reserved category.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [category_in_use, reserved_category]
  /finance/categories/{id}/archive:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      operationId: postFinanceCategoryArchive
      summary: Archive a category
      responses:
        "200":
          description: Archived category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Category not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: Reserved category.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [reserved_category]
  /finance/balance:
    get:
      operationId: getFinanceBalance
      summary: Fund balance in cents
      responses:
        "200":
          description: Income less expenses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBalance"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/entries:
    get:
      operationId: getFinanceEntries
      summary: List entries in the active school
      responses:
        "200":
          description: Append-only ledger.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceEntry"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: postFinanceEntries
      summary: Record an income or expense as an officer with MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFinanceEntry"
      responses:
        "201":
          description: Entry recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Category not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "Invalid input: invalid_amount, invalid_date, future_date, description_required, description_too_long, invalid_category, reserved_category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /finance/entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFinanceEntry
      summary: Get an entry in the active school
      responses:
        "200":
          description: Entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entry not found (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /finance/entries/{entryId}/reversal:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postFinanceEntryReversal
      summary: Reverse an entry as any officer with MFA
      description: >
        Records, in one transaction, a Reversal: an entry with the same amount and category, the
        opposite direction, today's date in Argentina and the description "Reversión: " followed by
        the original's. Old entries may be reversed; the Reversal falls in the current period.
      responses:
        "201":
          description: Reversal recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEntry"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entry not found in the active school (`not_found`). Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: >
            Nothing is written. `already_reversed`: the entry already has its Reversal.
            `cannot_reverse_reversal`: the entry is itself a Reversal; record a new entry instead.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [already_reversed, cannot_reverse_reversal]
components:
  responses:
    InvalidElectionDraft:
      description: >
        Nothing was written. `invalid_name`: name missing, null, blank or longer than 120 characters.
        `invalid_window`: `startsAt` or `endsAt` missing, null, not an RFC 3339 date-time or not a whole minute,
        `endsAt` not after `startsAt`, or `startsAt` in the past. `invalid_submission_period`: `submissionStartsAt`
        or `submissionEndsAt` missing, null, not an RFC 3339 date-time or not a whole minute, `submissionEndsAt` not after
        `submissionStartsAt`, or `submissionEndsAt` not before `startsAt`. `invalid_positions`: `positions` null or
        empty, or a name blank, longer than 120 characters or repeated (case-insensitive).
        `mode_not_supported`: `mode` null or other than `secret`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [invalid_name, invalid_window, invalid_submission_period, invalid_positions, mode_not_supported]
    BadRequest:
      description: Body is not JSON, has unknown fields or trailing data, or exceeds 4 KiB (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: Too many attempts from this client or for this email (`too_many_attempts`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidToken:
      description: The token is unknown, used, expired or for another purpose (`invalid_token`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidMfaCode:
      description: Wrong, reused or unknown code (`invalid_code`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        The user is not a school admin of the active tenant (`forbidden`), or is one but the session has not
        completed two-factor authentication (`mfa_required`; see `mfa` in `/auth/me`). Nothing is read or
        written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DirectoryForbidden:
      description: >
        The user lacks the required role in the active tenant (`forbidden`), or has a privileged role
        without a verified two-factor session (`mfa_required`). Nothing is read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    EventBudgetTotals:
      type: object
      required: [costCents, incomeCents, resultCents, breakEvenCents]
      properties:
        costCents: {type: integer, format: int64}
        incomeCents: {type: integer, format: int64}
        resultCents: {type: integer, format: int64}
        breakEvenCents: {type: integer, format: int64, nullable: true}
    EventBudgetDay:
      type: object
      required: [day, totals]
      properties:
        day: {type: string}
        totals: {$ref: "#/components/schemas/EventBudgetTotals"}
    EventBudgetDetail:
      type: object
      required: [id, name, startsOn, endsOn, archived, lines, totals, days]
      properties:
        id: {type: string}
        name: {type: string}
        startsOn: {type: string}
        endsOn: {type: string}
        archived: {type: boolean}
        lines:
          type: array
          items: {$ref: "#/components/schemas/EventBudgetLine"}
        totals: {$ref: "#/components/schemas/EventBudgetTotals"}
        days:
          type: array
          items: {$ref: "#/components/schemas/EventBudgetDay"}
    EventBudgetLineInput:
      type: object
      additionalProperties: false
      required: [kind, description]
      properties:
        kind: {type: string, description: "cost, ticket, foodtruck, sponsor or due"}
        description: {type: string}
        headingId: {type: string}
        contactId: {type: string}
        referencePriceId: {type: string}
        quantity: {type: integer, format: int64}
        unitAmountCents: {type: integer, format: int64}
        day: {type: string}
    EventBudgetLine:
      type: object
      required: [id, kind, description]
      properties:
        id: {type: string}
        kind: {type: string}
        description: {type: string}
        headingId: {type: string}
        contactId: {type: string}
        quantity: {type: integer, format: int64}
        unitAmountCents: {type: integer, format: int64}
        day: {type: string}
    EventBudgetInput:
      type: object
      additionalProperties: false
      required: [name, startsOn, endsOn]
      properties:
        name: {type: string}
        startsOn: {type: string}
        endsOn: {type: string}
    EventBudget:
      type: object
      required: [id, name, startsOn, endsOn, archived]
      properties:
        id: {type: string}
        name: {type: string}
        startsOn: {type: string}
        endsOn: {type: string}
        archived: {type: boolean}
    NewFinanceCategory:
      type: object
      additionalProperties: false
      required: [name, direction]
      properties:
        name: { type: string }
        direction: { type: string, enum: [income, expense] }
    RenameFinanceCategory:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
    FinanceCategory:
      type: object
      required: [id, name, direction, active, reserved]
      properties:
        id: { type: string }
        name: { type: string }
        direction: { type: string }
        active: { type: boolean }
        reserved: { type: boolean }
    NewFinanceEntry:
      type: object
      additionalProperties: false
      required: [categoryId, direction, date, amountCents, description]
      properties:
        categoryId: { type: string }
        direction: { type: string }
        date: { type: string }
        amountCents: { type: integer, format: int64 }
        description: { type: string }
    FinanceEntry:
      type: object
      required: [id, categoryId, direction, date, amountCents, description, recordedBy, recordedAt]
      properties:
        id: { type: string }
        categoryId: { type: string }
        direction: { type: string }
        date: { type: string }
        amountCents: { type: integer, format: int64 }
        description: { type: string }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        reversesId:
          type: string
          description: Present when this entry is a Reversal; the id of the entry it reverses.
        reversalId:
          type: string
          description: Present when this entry was reversed; the id of its Reversal.
        reversedBy:
          type: string
          description: Present when this entry was reversed; the Roster name of the officer who reversed it.
        reversedOn:
          type: string
          description: Present when this entry was reversed; the Reversal's date (YYYY-MM-DD, Argentina).
    FinanceBalance:
      type: object
      required: [balanceCents]
      properties:
        balanceCents: { type: integer, description: "The exact sum; may exceed int64." }
    ForbiddenError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [forbidden, mfa_required]
    NotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [not_found]
    CommissionMember:
      type: object
      required: [rosterMemberId, fullName]
      properties:
        rosterMemberId:
          type: string
        fullName:
          type: string
    ElectoralCommission:
      type: object
      description: The Electoral commission (UI "Centro de estudiantes").
      required: [id, createdAt, members]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          description: Ordered by name.
          items:
            $ref: "#/components/schemas/CommissionMember"
    ElectoralCommissionStatus:
      type: object
      required: [commission, isMember, canDesignate]
      properties:
        commission:
          allOf:
            - $ref: "#/components/schemas/ElectoralCommission"
          nullable: true
          description: The current commission; null when none was designated.
        isMember:
          type: boolean
          description: The caller's roster entry is on the current commission.
        canDesignate:
          type: boolean
          description: The caller's role allows designating or replacing the commission now.
    CommissionDesignation:
      type: object
      additionalProperties: false
      properties:
        rosterMemberIds:
          type: array
          description: Roster member ids; at least one (`empty_commission` otherwise), repeats count once.
          items:
            type: string
    ElectionMode:
      type: string
      enum: [secret]
      description: Only "Voto secreto"; any other value is 422 `mode_not_supported`.
    ElectionState:
      type: string
      enum: [draft, submission, scheduled, open, closed, annulled]
      description: >
        `annulled` once the election was annulled, whatever the clock says. Otherwise computed from the server
        clock against the dates; every window includes its start and excludes its end.
        `draft` before `submissionStartsAt`, `submission` until `submissionEndsAt`, `scheduled` until `startsAt`,
        `open` until `endsAt`, `closed` from `endsAt` on.
    AnnulmentRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: >
            Public: every member of the school sees it next to the election. Trimmed; 1 to 500 characters once trimmed
            (`reason_required`, `reason_too_long`). The request body is capped at 4 KiB (`bad_request`).
    Annulment:
      type: object
      required: [reason, annulledAt]
      properties:
        reason:
          type: string
        annulledAt:
          type: string
          format: date-time
    ElectionDraftRequest:
      type: object
      additionalProperties: false
      required: [name, submissionStartsAt, submissionEndsAt, startsAt, endsAt]
      description: >
        Date-times are RFC 3339 with offset (Argentina is -03:00). `submissionEndsAt` is exclusive: a period
        "1 to 5 March" ends at 2027-03-06T00:00:00-03:00. The four dates are whole minutes (no seconds): one
        with seconds or a fraction of a second is rejected with its field's code. Validation codes are listed in
        the 422 response.
      properties:
        name:
          type: string
          maxLength: 120
        mode:
          allOf:
            - $ref: "#/components/schemas/ElectionMode"
          description: Defaults to `secret` when absent.
        submissionStartsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_submission_period`.
        submissionEndsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_submission_period`.
        startsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_window`.
        endsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_window`.
        positions:
          type: array
          description: >
            Positions in order. When absent the election gets "Presidente", "Vicepresidente", "Secretario",
            "Tesorero".
          items:
            type: string
            maxLength: 120
    Election:
      type: object
      required: [id, name, mode, submissionStartsAt, submissionEndsAt, startsAt, endsAt, positions, state, commission]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          $ref: "#/components/schemas/ElectionMode"
        submissionStartsAt:
          type: string
          format: date-time
        submissionEndsAt:
          type: string
          format: date-time
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        positions:
          type: array
          description: In order.
          items:
            type: string
        state:
          $ref: "#/components/schemas/ElectionState"
        annulment:
          allOf:
            - $ref: "#/components/schemas/Annulment"
          description: >
            Present only when the election was annulled: its public reason. An annulled election carries no vote
            counts.
        commission:
          type: array
          description: Members of the election's Electoral commission, ordered by name.
          items:
            $ref: "#/components/schemas/CommissionMember"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    ClaimRequest:
      type: object
      required: [code, email, password]
      additionalProperties: false
      properties:
        code:
          type: string
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The value after `#token=` in the emailed link.
    PasswordResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    RedeemRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    Role:
      type: string
      enum: [school_admin, officer, student]
    MfaState:
      type: string
      enum: [not_required, enrollment_required, pending, satisfied]
      description: >
        Two-factor state of the session, computed from the role in the active tenant. School admins, officers
        and members of the current Electoral commission are privileged. `not_required`: not privileged or no
        membership. `enrollment_required`: privileged without a confirmed TOTP. `pending`: confirmed TOTP but
        this session has not verified it. `satisfied`: this session verified a code. Endpoints for privileged
        users answer 403 `mfa_required` unless `satisfied`.
    MfaEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 (no padding) of the 20-byte secret, for manual entry. Shown once.
        otpauthUri:
          type: string
          description: "`otpauth://totp/Centro%20de%20Estudiantes:<email>?secret=...&issuer=Centro%20de%20Estudiantes&algorithm=SHA1&digits=6&period=30`"
    MfaCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `code` and `recoveryCode`; otherwise 400 `bad_request`.
      properties:
        code:
          type: string
        recoveryCode:
          type: string
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$"
    Me:
      type: object
      required: [userId, email, emailVerified, tenantId, tenantName, role, mfa]
      properties:
        userId:
          type: string
        email:
          type: string
        tenantId:
          type: string
          nullable: true
          description: Active tenant of the session; null whenever `role` is null (no membership there).
        tenantName:
          type: string
          nullable: true
          description: >
            Name of the active tenant's organization, as stored (display it as text); null exactly when
            `tenantId` is null.
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
          description: Role in the active tenant; null when the user has no membership.
        roles:
          type: array
          description: All roles in the active tenant when there is more than one.
          items:
            $ref: "#/components/schemas/Role"
        emailVerified:
          type: boolean
        mfa:
          $ref: "#/components/schemas/MfaState"
    SchoolMember:
      type: object
      required: [email, fullName, rosterMemberId, position, roles]
      properties:
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        rosterMemberId:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    RosterMember:
      type: object
      required: [id, fullName, documentNumber, hasActiveCode, hasAccount]
      properties:
        id:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        hasActiveCode:
          type: boolean
          description: An unused, unrevoked and unexpired access code exists.
        hasAccount:
          type: boolean
    ImportResult:
      type: object
      required: [inserted, skipped]
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
    ImportError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
    RowError:
      type: object
      required: [line, code, reason]
      properties:
        line:
          type: integer
          description: 1-based line of the file (the header is line 1); 0 when unknown.
        code:
          type: string
          description: What is wrong with the line; clients explain it in their own language.
          enum:
            - header_invalid
            - field_count
            - encoding_invalid
            - csv_malformed
            - full_name_required
            - full_name_too_long
            - full_name_invalid
            - full_name_invisible
            - document_number_required
            - document_number_spaces
            - document_number_format
            - document_number_length
            - document_number_duplicate
        reason:
          type: string
          description: The same problem in English, for logs and API users.
        duplicateOfLine:
          type: integer
          description: Only for document_number_duplicate, the line that already has this DNI.
    IssuedCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$"
        expiresAt:
          type: string
          format: date-time
    IssuedMemberCode:
      type: object
      required: [memberId, fullName, documentNumber, code, expiresAt]
      properties:
        memberId:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
    ContactHeading:
      type: object
      required: [id, name, archived, reserved]
      properties:
        id:
          type: string
        name:
          type: string
        archived:
          type: boolean
        reserved:
          type: boolean
    HeadingNameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
    ReferencePrice:
      type: object
      required: [id, description, amountCents, date, createdAt]
      properties:
        id:
          type: string
        description:
          type: string
        amountCents:
          type: integer
          format: int64
        date:
          type: string
          example: "2026-09-01"
        createdAt:
          type: string
          format: date-time
    Contact:
      type: object
      required: [id, headingId, headingName, headingArchived, name, phone, email, zone, notes, referencePrices, createdAt, updatedAt]
      properties:
        id:
          type: string
        headingId:
          type: string
        headingName:
          type: string
        headingArchived:
          type: boolean
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        zone:
          type: string
        notes:
          type: string
        referencePrices:
          type: array
          items:
            $ref: "#/components/schemas/ReferencePrice"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateContactRequest:
      type: object
      required: [name, headingId]
      additionalProperties: false
      properties:
        name:
          type: string
        headingId:
          type: string
        phone:
          type: string
        email:
          type: string
        zone:
          type: string
        notes:
          type: string
    UpdateContactRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        headingId:
          type: string
        phone:
          type: string
        email:
          type: string
        zone:
          type: string
        notes:
          type: string
    CreateReferencePriceRequest:
      type: object
      required: [description, amountCents, date]
      additionalProperties: false
      properties:
        description:
          type: string
        amountCents:
          type: integer
          format: int64
        date:
          type: string
          example: "2026-09-01"
