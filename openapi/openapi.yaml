                    type: string
                    enum: [category_in_use, reserved_category]
  /finance/categories/{id}/archive:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      operationId: postFinanceCategoryArchive
      summary: Archive a category
      responses:
        "200":
          description: Archived category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Category not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: Reserved category.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [reserved_category]
  /finance/balance:
    get:
      operationId: getFinanceBalance
      summary: Fund balance in cents
      responses:
        "200":
          description: Income less expenses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBalance"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/entries:
    get:
      operationId: getFinanceEntries
      summary: List entries in the active school
      responses:
        "200":
          description: Append-only ledger.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceEntry"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: postFinanceEntries
      summary: Record an income or expense as an officer with MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFinanceEntry"
      responses:
        "201":
          description: Entry recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Category not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "Invalid input: invalid_amount, invalid_date, future_date, description_required, description_too_long, invalid_category, reserved_category."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /finance/report:
    get:
      operationId: getFinanceReport
      summary: Fund report (Informe de caja) for an inclusive date range
      description: >
        Any member of the active school reads it (Officers, Students, School admins), with the same
        session the ledger listing needs. Computed on demand; nothing is written. Dates are inclusive
        and compare with each Entry's date; a Reversal counts on its own date.
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: The report; a range without Entries has zero totals and opening equal to closing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MemberForbidden" }
        "422": { $ref: "#/components/responses/InvalidRange" }
  /finance/report.pdf:
    get:
      operationId: getFinanceReportPdf
      summary: Fund report as a PDF download
      description: Same readers and inclusive range rules as `/finance/report`; nothing is written.
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Attachment `informe-de-caja-<from>-a-<to>.pdf`.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MemberForbidden" }
        "422": { $ref: "#/components/responses/InvalidRange" }
        "503":
          description: The PDF converter is unavailable or timed out.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [pdf_unavailable] }
  /finance/report.csv:
    get:
      operationId: getFinanceReportCsv
      summary: Fund report as a CSV download
      description: >
        Same readers and range rules as `/finance/report`. UTF-8 with BOM, `;` separator, CRLF line
        ends, amounts with decimal comma and no thousands separator. First a summary section (header
        `concepto;tipo;monto`, then `Saldo inicial`, one row per Category total with its `tipo`
        (`ingreso`/`gasto`) and `Saldo final`), an empty line, then the range's ledger with the same
        columns as `/finance/entries.csv`. A cell starting with `=`, `+`, `-` or `@` gets a leading
        `'`, except an amount.
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Attachment `informe-de-caja-<from>-a-<to>.csv`.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MemberForbidden" }
        "422": { $ref: "#/components/responses/InvalidRange" }
  /finance/entries.csv:
    get:
      operationId: getFinanceEntriesCsv
      summary: Fund ledger as a CSV download
      description: >
        Same readers as `/finance/report`. Without `from` and `to` it exports the whole ledger;
        with either, both are required and validated like the report. Oldest first. Columns:
        `fecha;tipo;Categoría;descripción;monto;registrado por;revertido;con comprobante`, plus a
        trailing `alumno` column only for Officers and School admins with a two-factor session
        (never for Students). `monto` is signed (income +, expense −); `revertido` and
        `con comprobante` are `sí`/`no`. Same encoding and escaping as `/finance/report.csv`.
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Attachment `libro-de-caja.csv`, or `libro-de-caja-<from>-a-<to>.csv` with a range.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MemberForbidden" }
        "422": { $ref: "#/components/responses/InvalidRange" }
  /finance/entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFinanceEntry
      summary: Get an entry in the active school
      responses:
        "200":
          description: Entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entry not found (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /finance/entries/{entryId}/reversal:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postFinanceEntryReversal
      summary: Reverse an entry as any officer with MFA
      description: >
        Records, in one transaction, a Reversal: an entry with the same amount and category, the
        opposite direction, today's date in Argentina and the description "Reversión: " followed by
        the original's. Old entries may be reversed; the Reversal falls in the current period.
      responses:
        "201":
          description: Reversal recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEntry"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entry not found in the active school (`not_found`). Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: >
            Nothing is written. `already_reversed`: the entry already has its Reversal.
            `cannot_reverse_reversal`: the entry is itself a Reversal; record a new entry instead.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [already_reversed, cannot_reverse_reversal]
  /finance/entries/{entryId}/receipts:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFinanceEntryReceipts
      summary: List receipts of an entry in the active school
      description: Officers, school admins and veedors with a verified two-factor session.
      responses:
        "200":
          description: Receipts ordered by upload time ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceReceipt"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entry not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
    post:
      operationId: postFinanceEntryReceipts
      summary: Upload a receipt for an entry as an officer with MFA
      description: >
        Accepts raw JPG, PNG or PDF bytes up to 10 MiB (10485760 bytes), validated by file signature.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Receipt stored; entry now has `hasReceipt` true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReceipt"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entry not found in the active school (`not_found`). Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "413":
          description: File larger than 10 MiB (`file_too_large`). Nothing is written.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [file_too_large]
        "415":
          description: Unsupported file signature; must be JPG, PNG or PDF (`unsupported_media_type`). Nothing is written.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [unsupported_media_type]
        "422":
          description: Empty file (`empty_file`). Nothing is written.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [empty_file]
  /finance/entries/{entryId}/receipts/{receiptId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
      - name: receiptId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFinanceEntryReceipt
      summary: Download one receipt as an attachment
      description: >
        Officers, school admins and veedors with a verified two-factor session. Responds with the
        validated content type, `Content-Disposition: attachment; filename="comprobante-<receiptId>.<ext>"`
        and `X-Content-Type-Options: nosniff`.
      responses:
        "200":
          description: Receipt file bytes.
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entry or receipt not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
  /finance/dues:
    get:
      operationId: getFinanceDues
      summary: List dues in the active school
      description: Officers, school admins and veedors with a verified two-factor session.
      responses:
        "200":
          description: Dues ordered by due date descending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceDueSummary"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
    post:
      operationId: postFinanceDues
      summary: Create a due for all current roster members as an officer with MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFinanceDue"
      responses:
        "201":
          description: Due created and current roster members snapshotted in one transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDueDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
        "422":
          description: "Invalid input or empty roster: name_required, invalid_amount, invalid_date, empty_roster."
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [name_required, invalid_amount, invalid_date, empty_roster]
  /finance/dues/mine:
    get:
      operationId: getMyFinanceDues
      summary: List dues owed by the signed-in roster member
      responses:
        "200":
          description: Dues whose snapshot includes the caller's roster member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyFinanceDue"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/dues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFinanceDue
      summary: Get one due and its per-student status list
      description: Officers, school admins and veedors with a verified two-factor session. Never exposes document numbers.
      responses:
        "200":
          description: Due detail with per-student statuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDueDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
        "404":
          description: Due not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
    patch:
      operationId: patchFinanceDue
      summary: Edit a due as an officer with MFA
      description: Name can always be edited; amountCents and dueDate return 409 `due_frozen` once payments or exemptions exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceDue"
      responses:
        "200":
          description: Updated due.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDueDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
        "404":
          description: Due not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: Due already has payments or exemptions (`due_frozen`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [due_frozen]
        "422":
          description: "Invalid input: name_required, invalid_amount, invalid_date."
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [name_required, invalid_amount, invalid_date]
    delete:
      operationId: deleteFinanceDue
      summary: Delete a due without payments or exemptions as an officer with MFA
      responses:
        "204":
          description: Due deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
        "404":
          description: Due not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: Due already has payments or exemptions (`due_frozen`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [due_frozen]
  /finance/dues/{id}/exemptions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postFinanceDueExemptions
      summary: Exempt a roster member from a due, with a reason, as an officer with MFA
      description: >
        Records that a roster member in the due's snapshot does not owe it. One exemption per due and roster
        member; it cannot be edited or removed, and it freezes the due's amount and due date. Error bodies
        never carry the reason or a name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFinanceDueExemption"
      responses:
        "201":
          description: Exemption recorded; the due detail shows the member as `exempt` with the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDueDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
        "404":
          description: Due or roster member not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "409":
          description: >
            Nothing is written. `already_exempt`: the roster member is already exempt from this due.
            `has_payments`: the roster member has payments for this due whose Entry was not reversed.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [already_exempt, has_payments]
        "422":
          description: >
            Nothing is written. `reason_required`: reason missing, null, empty or only spaces.
            `reason_too_long`: more than 500 characters after trimming. `not_owed`: the roster member is not
            in the due's snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [reason_required, reason_too_long, not_owed]
  /finance/dues/{id}/payments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postFinanceDuePayment
      summary: Record a full or partial due payment for one roster member as an officer with MFA
      description: >
        Writes, in one transaction, the payment and its income Entry in the reserved category "Cuotas"
        with the description "Pago de cuota: " followed by the due's name. Payments for one roster member
        are serialized, so together they never exceed the due's amount. Reversing the payment's Entry
        (`POST /finance/entries/{entryId}/reversal`) discounts the payment; the due stays frozen.
        Errors never name the roster member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFinanceDuePayment"
      responses:
        "201":
          description: Payment and its Entry recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDuePayment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
        "404":
          description: Due or roster member not found in the active school (`not_found`). Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
        "422":
          description: >
            Nothing is written. `invalid_amount`: amount missing, zero or negative. `invalid_date` or
            `future_date`: the payment date. `not_owed`: the roster member is not in the due's snapshot.
            `overpayment`: the payment plus what was already paid exceeds the due's amount. `exempt`: the
            roster member is exempt from the due.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [invalid_amount, invalid_date, future_date, not_owed, overpayment, exempt]
  /finance/dues/{id}/members.csv:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFinanceDueMembersCsv
      summary: Download the per-student list of a due as CSV
      description: >
        Officers, school admins and veedors with a verified two-factor session. UTF-8 with a byte order
        mark, `;` as separator, one row per roster member of the due's snapshot: name, paid, owing,
        status and exemption reason. Never includes document numbers.
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/DirectoryForbidden" }
        "404":
          description: Due not found in the active school (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFoundError" }
components:
  parameters:
    ReportFrom:
      name: from
      in: query
      required: false
      description: First day of the range (YYYY-MM-DD, inclusive). Missing or invalid answers `invalid_range`.
      schema: { type: string }
    ReportTo:
      name: to
      in: query
      required: false
      description: Last day of the range (YYYY-MM-DD, inclusive). Missing or invalid answers `invalid_range`.
      schema: { type: string }
  responses:
    InvalidElectionList:
      description: >
        Nothing was written. `invalid_name`: list name missing, null, blank or longer than 80 characters.
        `invalid_candidates`: missing position, unknown position, duplicate position or duplicate candidate.
        `candidate_in_commission`: a candidate sits on the Electoral commission.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [invalid_name, invalid_candidates, candidate_in_commission]
    InvalidCommissionElectionList:
      description: >
        Nothing was written. Same validation as `InvalidElectionList`, plus `invalid_representative` when
        `representativeRosterMemberId` is missing, null or blank.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [invalid_name, invalid_candidates, candidate_in_commission, invalid_representative]
    ElectionListConflict:
      description: >
        Nothing was written. `election_frozen` (voting already started: from `startsAt` on the lists never change),
        `submission_closed` (outside the submission period), `list_name_taken` (another non-rejected list in the
        election has that name), or `candidate_on_other_list` (a candidate is already on a pending or approved
        list in the election).
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [election_frozen, submission_closed, list_name_taken, candidate_on_other_list]
    ElectionListEditConflict:
      description: >
        Nothing was written. Same conflicts as `ElectionListConflict`, plus `list_frozen` (approved) or
        `list_rejected` (rejected).
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [election_frozen, submission_closed, list_frozen, list_rejected, list_name_taken, candidate_on_other_list]
    ElectionListReviewConflict:
      description: >
        Nothing was written. `election_frozen` (voting already started), `submission_closed` (outside the
        submission period), `list_frozen` (already approved), or `list_rejected` (already rejected).
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [election_frozen, submission_closed, list_frozen, list_rejected]
    InvalidElectionDraft:
      description: >
        Nothing was written. `invalid_name`: name missing, null, blank or longer than 120 characters.
        `invalid_window`: `startsAt` or `endsAt` missing, null, not an RFC 3339 date-time or not a whole minute,
        `endsAt` not after `startsAt`, or `startsAt` in the past. `invalid_submission_period`: `submissionStartsAt`
        or `submissionEndsAt` missing, null, not an RFC 3339 date-time or not a whole minute, `submissionEndsAt` not after
        `submissionStartsAt`, or `submissionEndsAt` not before `startsAt`. `invalid_positions`: `positions` null or
        empty, or a name blank, longer than 120 characters or repeated (case-insensitive).
        `mode_not_supported`: `mode` null or other than `secret`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [invalid_name, invalid_window, invalid_submission_period, invalid_positions, mode_not_supported]
    BadRequest:
      description: Body is not JSON, has unknown fields or trailing data, or exceeds 4 KiB (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: Too many attempts from this client or for this email (`too_many_attempts`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidToken:
      description: The token is unknown, used, expired or for another purpose (`invalid_token`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidMfaCode:
      description: Wrong, reused or unknown code (`invalid_code`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        The user is not a school admin of the active tenant (`forbidden`), or is one but the session has not
        completed two-factor authentication (`mfa_required`; see `mfa` in `/auth/me`). Nothing is read or
        written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MemberForbidden:
      description: The user has no membership in the active school (`forbidden`). Nothing is read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRange:
      description: >
        `from` or `to` is missing or not a valid YYYY-MM-DD date, or `from` is after `to`
        (`invalid_range`). Nothing is read.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [invalid_range]
    DirectoryForbidden:
      description: >
        The user lacks the required role in the active tenant (`forbidden`), or has a privileged role
        without a verified two-factor session (`mfa_required`). Nothing is read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    EventBudgetTotals:
      type: object
