openapi: 3.0.3
info:
  title: Centro de Estudiantes API
  version: 0.1.0
  description: Contract shared by the Go API (api/) and the web client (web/). Edit this file first, then regenerate both sides.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Sign in with email and password
      description: >
        On success sets the session cookie `__Host-session` (HttpOnly, Secure, SameSite=Lax, Path=/,
        12 hours) and deletes the session the request arrived with, if any. Unknown email and wrong
        password get the same 401 body. Failed attempts are limited per email (5 per 15 minutes) and
        per client IP (50 per 15 minutes, sized for a school behind one address); further attempts get
        429. Server errors never count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong email or password (always `invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts (`too_many_attempts`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Sign out
      description: Deletes the current session, if any, and expires the cookie.
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Current user
      responses:
        "200":
          description: The signed-in user and the active tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/claim:
    post:
      operationId: postAuthClaim
      summary: Create an account with a school access code
      description: >
        No session needed. Creates the user, a `student` membership linked to the code's roster member,
        consumes the code and signs in (cookie as in login). Inputs are validated before any lookup:
        email (at most 254 characters, stored lowercase), password (10 to 128 characters, the rule shared
        by bootstrap, claim and password reset) and code
        (12 Crockford base32 characters; case, spaces and hyphens are ignored). Unknown, used, revoked,
        expired and already-linked codes all get the same `invalid_code`. Every `invalid_code` counts
        against a per-IP limit (50 per 15 minutes); further requests get 429. On success a
        verification link is emailed to the new address (see `/auth/email/verify`). Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "201":
          description: Account created and signed in; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: >
            An account with this email exists (`email_in_use`); nothing changed and the code stays usable.
            Sign in and use `/auth/redeem` instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`invalid_email`, `weak_password` or `invalid_code`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/redeem:
    post:
      operationId: postAuthRedeem
      summary: Add a school to the signed-in account with an access code
      description: >
        Adds a `student` membership in the code's tenant linked to its roster member, consumes the code
        and makes that tenant the session's active tenant. The session is rotated: a new cookie with the
        same absolute expiry (Max-Age is the remaining lifetime) and the old token stops working. Same
        code rules and rate limit as `/auth/claim`. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: Membership added; the new session points at the code's tenant.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: The user already has the student role in the code's tenant (`already_member`); the code stays usable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`invalid_code`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/email/verification:
    post:
      operationId: postAuthEmailVerification
      summary: Email a verification link to the signed-in user
      description: >
        Sends `{APP_BASE_URL}/verificar#token=...` (valid 48 hours) unless the email is already verified,
        in which case nothing is sent and the response is the same. Issuing a link invalidates the
        previous unused one. Shares the limit of the other mail requests (5 per 15 minutes per email,
        50 per client IP). Responses carry `Cache-Control: no-store`.
      responses:
        "202":
          description: Accepted; a link was sent if the email is not verified yet.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/email/verify:
    post:
      operationId: postAuthEmailVerify
      summary: Confirm the email address with an emailed token
      description: >
        No session needed. Consumes a `verify_email` token and marks the email verified. Tokens are
        single-use; unknown, used, expired and other-purpose tokens all get `invalid_token`, and each
        counts against a per-IP limit (50 per 15 minutes, shared by every token endpoint). Responses
        carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Email verified.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/link:
    post:
      operationId: postAuthLink
      summary: Email a sign-in link
      description: >
        No session needed. Always 202 with the same response whether or not an account exists; only an
        existing account gets `{APP_BASE_URL}/ingresar#token=...` (valid 15 minutes, single-use; issuing
        one invalidates the previous). Limited to 5 requests per 15 minutes per email and 50 per client IP,
        shared with `/auth/password/reset-request` and `/auth/email/verification`. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/link/consume:
    post:
      operationId: postAuthLinkConsume
      summary: Sign in with an emailed link
      description: >
        Consumes a `sign_in` token, marks the email verified (the link proves inbox access) and signs in
        exactly like `/auth/login` (same cookie and active tenant). Same token rules and limit as
        `/auth/email/verify`. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/password/reset-request:
    post:
      operationId: postAuthPasswordResetRequest
      summary: Email a password reset link
      description: >
        Same rules as `/auth/link`, but the link is `{APP_BASE_URL}/restablecer#token=...` (valid 30
        minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      summary: Set a new password with an emailed token
      description: >
        The password is checked first (10 to 128 characters): `weak_password` leaves the token usable.
        Then consumes a `reset_password` token, stores the new password and deletes every session of
        the user. Same token rules and limit as `/auth/email/verify`. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password changed; every session of the user was signed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: "`weak_password` or `invalid_token`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/password:
    post:
      operationId: postAuthPassword
      summary: Change the password of the signed-in user
      description: >
        Checks the new password first (10 to 128 characters, `weak_password`), then the current one. A wrong
        current password counts as a failed sign-in for the user's email (same limit as `/auth/login`:
        5 per 15 minutes, then 429). A school admin, officer or Electoral commission member needs a session that completed two-factor
        authentication. On success stores the new password, marks every pending emailed link of the user
        used, deletes every other session of the user and rotates this one: a new cookie with the same
        absolute expiry (Max-Age is the remaining lifetime) and the old token stops working. Errors change
        nothing. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed; the session cookie is rotated and every other session signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            School admin, officer or Electoral commission member whose session has not completed two-factor authentication
            (`mfa_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            `weak_password` (new password is not 10 to 128 characters), `invalid_credentials` (wrong current
            password) or `same_password` (the new password equals the current one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/mfa/enrollment:
    post:
      operationId: postAuthMfaEnrollment
      summary: Start (or restart) TOTP enrollment
      description: >
        Creates a new random TOTP secret (20 bytes; RFC 6238, HMAC-SHA1, 6 digits, 30 s) for the signed-in
        user and returns it once, as base32 without padding and as an `otpauth://` URI for a QR code. The
        secret is stored encrypted (AES-256-GCM). Calling again before confirming replaces the pending
        secret. Users with a confirmed TOTP get 409 `already_enrolled` (an operator resets it with
        `admin reset-mfa`). Responses carry `Cache-Control: no-store`.
      responses:
        "200":
          description: Pending secret created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: The user already has a confirmed TOTP (`already_enrolled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/mfa/enrollment/confirm:
    post:
      operationId: postAuthMfaEnrollmentConfirm
      summary: Confirm TOTP enrollment with a first code
      description: >
        Checks a code of the pending secret (one step of drift accepted). On success the TOTP is confirmed,
        10 single-use recovery codes are returned once (`XXXXX-XXXXX`, only their SHA-256 is stored) and the
        session is rotated into a two-factor session (new `__Host-session` cookie, same attributes as
        login but Max-Age is the session's remaining lifetime, which is not extended; the previous session
        is deleted). Wrong codes and confirming without a pending secret get
        `invalid_code`. Failures share the per-user limit of `/auth/mfa/verify` (5 per 15 minutes); further
        attempts get 429. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeRequest"
      responses:
        "200":
          description: Enrollment confirmed; the rotated session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: The TOTP is already confirmed (`already_enrolled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidMfaCode"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/mfa/verify:
    post:
      operationId: postAuthMfaVerify
      summary: Complete two-factor sign-in
      description: >
        Send exactly one of `code` (6 digits from the authenticator app; one step of drift accepted) or
        `recoveryCode` (single-use; case, spaces and hyphens ignored). On success the session is rotated
        into a two-factor session: a new `__Host-session` cookie with the same attributes as login except
        Max-Age, which is the session's remaining lifetime (not extended), and the previous session row
        is deleted. A code whose time step was already used, a used recovery code,
        a wrong code and a user without confirmed TOTP all get the same `invalid_code`. Failures are
        limited per user (5 per 15 minutes, shared with enrollment confirmation); further attempts get
        429. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "204":
          description: Verified; the rotated session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidMfaCode"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /members:
    get:
      operationId: getMembers
      summary: List accounts and unclaimed officers in the active school
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /members/{memberId}/officer:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: postMemberOfficer
      summary: Assign an officer position to a roster member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position:
                  type: string
      responses:
        "201":
          description: Assigned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Roster member not found.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [not_found]
        "409":
          description: already_officer or position_taken.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [already_officer, position_taken]
        "422":
          description: invalid_position.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [invalid_position]
    delete:
      operationId: deleteMemberOfficer
      summary: Remove an officer position
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Officer not found.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [not_found]
  /roster:
    get:
      operationId: getRoster
      summary: List the roster of the active tenant
      description: >
        School admins with a two-factor session only. Responses carry `Cache-Control: no-store` (personal
        data).
      responses:
        "200":
          description: Roster members ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /roster/import:
    post:
      operationId: postRosterImport
      summary: Import roster members from CSV
      description: >
        School admins with a two-factor session only. The body is CSV (max 1 MiB, max 5000 data rows) whose first line is the
        header `full_name,document_number` (case-insensitive, trimmed). `document_number` must have 7 to 9
        digits after removing dots and spaces. The import is atomic: any invalid row or a document number
        repeated in the file writes nothing. Rows whose document number already exists in the tenant are
        skipped, never updated.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "200":
          description: Imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Body larger than 1 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type is not `text/csv` (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Nothing was written. `invalid_rows` lists every problem with its 1-based line number (the header
            is line 1); `too_many_rows` when the file has more than 5000 data rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
  /roster/{memberId}/access-code:
    post:
      operationId: postRosterMemberAccessCode
      summary: Issue an access code for one roster member
      description: >
        School admins with a two-factor session only. Returns the code in plain text once (`Cache-Control: no-store`); only its HMAC is
        stored. The code expires after 30 days and revokes the member's previous unused code.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Code issued.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such member in the active tenant (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The member already has an account (`member_has_account`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /roster/access-codes:
    post:
      operationId: postRosterAccessCodes
      summary: Issue codes for every member without an account and without an active code
      description: "School admins with a two-factor session only. Codes are shown once, for printing (`Cache-Control: no-store`)."
      responses:
        "201":
          description: Codes issued, ordered by name; empty when nobody needed one.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssuedMemberCode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /electoral-commission:
    get:
      operationId: getElectoralCommission
      summary: Read the active school's current Electoral commission
      description: >
        Any member of the active school (student, officer or school admin); no second factor needed.
        `commission` is null until one is designated. `isMember` says whether the caller's roster entry sits
        on it; `canDesignate` whether the caller may designate or replace it now by role (any officer when
        the school has officers, otherwise the school admin), regardless of the second factor and of
        `election_frozen`. Responses carry `Cache-Control: no-store`.
      responses:
        "200":
          description: The commission (or null) and the caller's relation to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectoralCommissionStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
    put:
      operationId: putElectoralCommission
      summary: Designate or replace the members of the current Electoral commission
      description: >
        Any officer when the school has officers (an officer position or the officer role); otherwise the
        school admin. Checked on every request, so it applies to replacing too. The role is checked first
        (`forbidden`), then the second factor (`mfa_required`); both before the body is read. Each id is a
        roster member of the active school with an account; a repeated id is stored once. The whole list
        replaces the current members; the commission is created when the school has none. Every error writes
        nothing. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionDesignation"
      responses:
        "200":
          description: The commission as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectoralCommission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            `forbidden` (a student without an officer position, a school admin while the school has officers,
            or no membership) or `mfa_required` (allowed role, session without a verified second factor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: An id is not a roster member of the active school (`not_found`); never says whether it exists elsewhere.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: An election of this commission already opened (`election_frozen`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_frozen]
        "422":
          description: >
            `empty_commission` (the list is empty, null or missing) or `no_account` (a roster member without an
            account).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [empty_commission, no_account]
  /electoral-commission/candidates:
    get:
      operationId: getElectoralCommissionCandidates
      summary: List the roster members who can sit on the Electoral commission
      description: >
        Roster members of the active school with an account, ordered by name. Same permission and order of
        checks as `PUT /electoral-commission` (`forbidden`, then `mfa_required`). Responses carry
        `Cache-Control: no-store`.
      responses:
        "200":
          description: Candidates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` or `mfa_required`, as in `PUT /electoral-commission`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
  /elections:
    post:
      operationId: postElection
      summary: Create the draft of an election
      description: >
        Members of the current Electoral commission only, with a verified second factor (`forbidden` first, then
        `mfa_required`, both before the body is read): students, officers (the Presidente included) and school
        admins who are not on it get `forbidden`. The election belongs to the current commission. Every error
        writes nothing; the validation codes are listed in the 422 response. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionDraftRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` (not on the current Electoral commission) or `mfa_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "409":
          description: >
            The school already has an election neither published nor annulled (`election_in_progress`). Of two
            simultaneous requests exactly one gets 201.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_in_progress]
        "422":
          $ref: "#/components/responses/InvalidElectionDraft"
  /elections/current:
    get:
      operationId: getCurrentElection
      summary: Read the active school's election in progress (neither published nor annulled)
      description: "Any member of the active school. Responses carry `Cache-Control: no-store`."
      responses:
        "200":
          description: The election.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No election in progress (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
  /elections/{electionId}:
    parameters:
      - name: electionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getElection
      summary: Read an election of the active school
      description: "Any member of the active school. Responses carry `Cache-Control: no-store`."
      responses:
        "200":
          description: The election.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No such election in the active school (`not_found`), whether or not it exists in another.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    put:
      operationId: putElection
      summary: Edit the draft of an election
      description: >
        Same permission and order of checks as `POST /elections`. Replaces name, mode, dates and positions
        while the election is a draft (state `draft`). Every error writes nothing. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionDraftRequest"
      responses:
        "200":
          description: The election as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` (not on the current Electoral commission) or `mfa_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No such election in the active school (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: The election is no longer a draft (`election_not_draft`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_not_draft]
        "422":
          $ref: "#/components/responses/InvalidElectionDraft"
components:
  responses:
    InvalidElectionDraft:
      description: >
        Nothing was written. `invalid_name`: name missing, null, blank or longer than 120 characters.
        `invalid_window`: `startsAt` or `endsAt` missing, null, not an RFC 3339 date-time or not a whole minute,
        `endsAt` not after `startsAt`, or `startsAt` in the past. `invalid_submission_period`: `submissionStartsAt`
        or `submissionEndsAt` missing, null, not an RFC 3339 date-time or not a whole minute, `submissionEndsAt` not after
        `submissionStartsAt`, or `submissionEndsAt` not before `startsAt`. `invalid_positions`: `positions` null or
        empty, or a name blank, longer than 120 characters or repeated (case-insensitive).
        `mode_not_supported`: `mode` null or other than `secret`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [invalid_name, invalid_window, invalid_submission_period, invalid_positions, mode_not_supported]
    BadRequest:
      description: Body is not JSON, has unknown fields or trailing data, or exceeds 4 KiB (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: Too many attempts from this client or for this email (`too_many_attempts`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidToken:
      description: The token is unknown, used, expired or for another purpose (`invalid_token`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidMfaCode:
      description: Wrong, reused or unknown code (`invalid_code`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        The user is not a school admin of the active tenant (`forbidden`), or is one but the session has not
        completed two-factor authentication (`mfa_required`; see `mfa` in `/auth/me`). Nothing is read or
        written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ForbiddenError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [forbidden, mfa_required]
    NotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [not_found]
    CommissionMember:
      type: object
      required: [rosterMemberId, fullName]
      properties:
        rosterMemberId:
          type: string
        fullName:
          type: string
    ElectoralCommission:
      type: object
      description: The Electoral commission (UI "Centro de estudiantes").
      required: [id, createdAt, members]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          description: Ordered by name.
          items:
            $ref: "#/components/schemas/CommissionMember"
    ElectoralCommissionStatus:
      type: object
      required: [commission, isMember, canDesignate]
      properties:
        commission:
          allOf:
            - $ref: "#/components/schemas/ElectoralCommission"
          nullable: true
          description: The current commission; null when none was designated.
        isMember:
          type: boolean
          description: The caller's roster entry is on the current commission.
        canDesignate:
          type: boolean
          description: The caller's role allows designating or replacing the commission now.
    CommissionDesignation:
      type: object
      additionalProperties: false
      properties:
        rosterMemberIds:
          type: array
          description: Roster member ids; at least one (`empty_commission` otherwise), repeats count once.
          items:
            type: string
    ElectionMode:
      type: string
      enum: [secret]
      description: Only "Voto secreto"; any other value is 422 `mode_not_supported`.
    ElectionState:
      type: string
      enum: [draft, submission, scheduled, open, closed]
      description: >
        Computed from the server clock against the dates; every window includes its start and excludes its end.
        `draft` before `submissionStartsAt`, `submission` until `submissionEndsAt`, `scheduled` until `startsAt`,
        `open` until `endsAt`, `closed` from `endsAt` on.
    ElectionDraftRequest:
      type: object
      additionalProperties: false
      required: [name, submissionStartsAt, submissionEndsAt, startsAt, endsAt]
      description: >
        Date-times are RFC 3339 with offset (Argentina is -03:00). `submissionEndsAt` is exclusive: a period
        "1 to 5 March" ends at 2027-03-06T00:00:00-03:00. The four dates are whole minutes (no seconds): one
        with seconds or a fraction of a second is rejected with its field's code. Validation codes are listed in
        the 422 response.
      properties:
        name:
          type: string
          maxLength: 120
        mode:
          allOf:
            - $ref: "#/components/schemas/ElectionMode"
          description: Defaults to `secret` when absent.
        submissionStartsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_submission_period`.
        submissionEndsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_submission_period`.
        startsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_window`.
        endsAt:
          type: string
          format: date-time
          description: Whole minutes (no seconds); otherwise `invalid_window`.
        positions:
          type: array
          description: >
            Positions in order. When absent the election gets "Presidente", "Vicepresidente", "Secretario",
            "Tesorero".
          items:
            type: string
            maxLength: 120
    Election:
      type: object
      required: [id, name, mode, submissionStartsAt, submissionEndsAt, startsAt, endsAt, positions, state, commission]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          $ref: "#/components/schemas/ElectionMode"
        submissionStartsAt:
          type: string
          format: date-time
        submissionEndsAt:
          type: string
          format: date-time
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        positions:
          type: array
          description: In order.
          items:
            type: string
        state:
          $ref: "#/components/schemas/ElectionState"
        commission:
          type: array
          description: Members of the election's Electoral commission, ordered by name.
          items:
            $ref: "#/components/schemas/CommissionMember"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    ClaimRequest:
      type: object
      required: [code, email, password]
      additionalProperties: false
      properties:
        code:
          type: string
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The value after `#token=` in the emailed link.
    PasswordResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    RedeemRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    Role:
      type: string
      enum: [school_admin, officer, student]
    MfaState:
      type: string
      enum: [not_required, enrollment_required, pending, satisfied]
      description: >
        Two-factor state of the session, computed from the role in the active tenant. School admins, officers
        and members of the current Electoral commission are privileged. `not_required`: not privileged or no
        membership. `enrollment_required`: privileged without a confirmed TOTP. `pending`: confirmed TOTP but
        this session has not verified it. `satisfied`: this session verified a code. Endpoints for privileged
        users answer 403 `mfa_required` unless `satisfied`.
    MfaEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 (no padding) of the 20-byte secret, for manual entry. Shown once.
        otpauthUri:
          type: string
          description: "`otpauth://totp/Centro%20de%20Estudiantes:<email>?secret=...&issuer=Centro%20de%20Estudiantes&algorithm=SHA1&digits=6&period=30`"
    MfaCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `code` and `recoveryCode`; otherwise 400 `bad_request`.
      properties:
        code:
          type: string
        recoveryCode:
          type: string
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$"
    Me:
      type: object
      required: [userId, email, emailVerified, tenantId, tenantName, role, mfa]
      properties:
        userId:
          type: string
        email:
          type: string
        tenantId:
          type: string
          nullable: true
          description: Active tenant of the session; null whenever `role` is null (no membership there).
        tenantName:
          type: string
          nullable: true
          description: >
            Name of the active tenant's organization, as stored (display it as text); null exactly when
            `tenantId` is null.
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
          description: Role in the active tenant; null when the user has no membership.
        roles:
          type: array
          description: All roles in the active tenant when there is more than one.
          items:
            $ref: "#/components/schemas/Role"
        emailVerified:
          type: boolean
        mfa:
          $ref: "#/components/schemas/MfaState"
    SchoolMember:
      type: object
      required: [email, fullName, rosterMemberId, position, roles]
      properties:
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        rosterMemberId:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    RosterMember:
      type: object
      required: [id, fullName, documentNumber, hasActiveCode, hasAccount]
      properties:
        id:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        hasActiveCode:
          type: boolean
          description: An unused, unrevoked and unexpired access code exists.
        hasAccount:
          type: boolean
    ImportResult:
      type: object
      required: [inserted, skipped]
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
    ImportError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
    RowError:
      type: object
      required: [line, code, reason]
      properties:
        line:
          type: integer
          description: 1-based line of the file (the header is line 1); 0 when unknown.
        code:
          type: string
          description: What is wrong with the line; clients explain it in their own language.
          enum:
            - header_invalid
            - field_count
            - encoding_invalid
            - csv_malformed
            - full_name_required
            - full_name_too_long
            - full_name_invalid
            - full_name_invisible
            - document_number_required
            - document_number_spaces
            - document_number_format
            - document_number_length
            - document_number_duplicate
        reason:
          type: string
          description: The same problem in English, for logs and API users.
        duplicateOfLine:
          type: integer
          description: Only for document_number_duplicate, the line that already has this DNI.
    IssuedCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$"
        expiresAt:
          type: string
          format: date-time
    IssuedMemberCode:
      type: object
      required: [memberId, fullName, documentNumber, code, expiresAt]
      properties:
        memberId:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
