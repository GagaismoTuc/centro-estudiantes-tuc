        "422":
          $ref: "#/components/responses/InvalidElectionDraft"
  /elections/{electionId}/annulment:
    parameters:
      - name: electionId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: postElectionAnnulment
      summary: Annul an election before its result is published
      description: >
        Members of the election's Electoral commission only, with a verified second factor. Checks, in order and
        before the body is read: `forbidden` (no membership in the active school), `not_found` (no such election
        in it, whether or not it exists in another), `forbidden` (not on the election's commission: students,
        officers and school admins who are not on it), `mfa_required`. Then the reason (422) and the election's
        state (409). Annulling is irreversible: the election publishes no result, accepts no change and never
        reopens; the commission's mandate ends, so the school can organize another election once the officers
        designate a new commission. Of two simultaneous requests exactly one annuls. Every error writes nothing.
        Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnulmentRequest"
      responses:
        "200":
          description: The election as stored, with state `annulled` and its `annulment`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` (not on the election's Electoral commission) or `mfa_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No such election in the active school (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: >
            The election was already annulled (`election_annulled`; the original reason stays) or its result is
            published: the voting ended (state `closed`) (`election_published`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_annulled, election_published]
        "422":
          description: >
            Nothing was written. `reason_required`: `reason` missing, null, empty or only spaces.
            `reason_too_long`: more than 500 characters once trimmed.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [reason_required, reason_too_long]
