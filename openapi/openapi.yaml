              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}/share:
    post:
      operationId: postContactShare
      summary: Share a contact with the platform-wide shared directory
      description: >
        Officers with a two-factor session only. Copies the shareable fields (excluding notes and
        source school) into a pending shared-directory entry for Platform admin approval. Sharing a
        contact that already has an approved entry creates a new pending version while keeping the
        approved entry visible until the new version is approved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Share request created in `pending` state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedContactShare"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DirectoryForbidden"
        "404":
          description: Contact not found in the active school (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Contact already has a `pending` share request (`already_pending`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [already_pending]
    delete:
      operationId: deleteContactShare
      summary: Withdraw a shared contact from the shared directory
      description: >
        Officers with a two-factor session only. Withdraws any pending or approved share requests
        for the contact so it is no longer listed in the shared directory.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Share withdrawn.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DirectoryForbidden"
        "404":
          description: Contact not found (`not_found`) or not actively shared (`not_shared`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [not_found, not_shared]
  /shared-contacts:
    get:
      operationId: getSharedContacts
      summary: Search approved contacts in the shared directory
      description: >
        Officers, school admins and veedors with a two-factor session. Returns only approved entries
        without notes or source school, paginated in pages of 50.
      parameters:
        - name: heading
          in: query
          required: false
          schema:
            type: string
        - name: zone
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: One page of approved shared contacts ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedContactPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DirectoryForbidden"
  /shared-contacts/{id}/copy:
    post:
      operationId: postSharedContactCopy
      summary: Copy an approved shared contact into the active school's directory
      description: >
        Officers with a two-factor session only. Creates an independent copy (without notes or
        source school) under the active heading of matching name (case-insensitive) or "otros".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Contact copied into the active school's directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DirectoryForbidden"
        "404":
          description: Shared contact not found or not approved (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /roster/access-codes:
    post:
      operationId: postRosterAccessCodes
      summary: Issue codes for every member without an account and without an active code
      description: "School admins with a two-factor session only. Codes are shown once, for printing (`Cache-Control: no-store`)."
      responses:
        "201":
          description: Codes issued, ordered by name; empty when nobody needed one.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssuedMemberCode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /electoral-commission:
    get:
      operationId: getElectoralCommission
      summary: Read the active school's current Electoral commission
      description: >
        Any member of the active school (student, officer or school admin); no second factor needed.
        `commission` is null until one is designated. `isMember` says whether the caller's roster entry sits
        on it; `canDesignate` whether the caller may designate or replace it now by role (any officer when
        the school has officers, otherwise the school admin), regardless of the second factor and of
        `election_frozen`. Responses carry `Cache-Control: no-store`.
      responses:
        "200":
          description: The commission (or null) and the caller's relation to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectoralCommissionStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
    put:
      operationId: putElectoralCommission
      summary: Designate or replace the members of the current Electoral commission
      description: >
        Any officer when the school has officers (an officer position or the officer role); otherwise the
        school admin. Checked on every request, so it applies to replacing too. The role is checked first
        (`forbidden`), then the second factor (`mfa_required`); both before the body is read. Each id is a
        roster member of the active school with an account; a repeated id is stored once. The whole list
        replaces the current members; the commission is created when the school has none. Every error writes
        nothing. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionDesignation"
      responses:
        "200":
          description: The commission as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectoralCommission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            `forbidden` (a student without an officer position, a school admin while the school has officers,
            or no membership) or `mfa_required` (allowed role, session without a verified second factor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: An id is not a roster member of the active school (`not_found`); never says whether it exists elsewhere.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: An election of this commission already opened (`election_frozen`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_frozen]
        "422":
          description: >
            `empty_commission` (the list is empty, null or missing) or `no_account` (a roster member without an
            account).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [empty_commission, no_account]
  /electoral-commission/candidates:
    get:
      operationId: getElectoralCommissionCandidates
      summary: List the roster members who can sit on the Electoral commission
      description: >
        Roster members of the active school with an account, ordered by name. Same permission and order of
        checks as `PUT /electoral-commission` (`forbidden`, then `mfa_required`). Responses carry
        `Cache-Control: no-store`.
      responses:
        "200":
          description: Candidates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` or `mfa_required`, as in `PUT /electoral-commission`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
  /elections:
    post:
      operationId: postElection
      summary: Create the draft of an election
      description: >
        Members of the current Electoral commission only, with a verified second factor (`forbidden` first, then
        `mfa_required`, both before the body is read): students, officers (the Presidente included) and school
        admins who are not on it get `forbidden`. The election belongs to the current commission. Every error
        writes nothing; the validation codes are listed in the 422 response. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionDraftRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden` (not on the current Electoral commission) or `mfa_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "409":
          description: >
            The school already has an election neither published nor annulled (`election_in_progress`). Of two
            simultaneous requests exactly one gets 201.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_in_progress]
        "422":
          $ref: "#/components/responses/InvalidElectionDraft"
  /elections/current:
    get:
      operationId: getCurrentElection
      summary: Read the active school's election in progress (neither published nor annulled)
      description: "Any member of the active school. Responses carry `Cache-Control: no-store`."
      responses:
        "200":
          description: The election.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: No election in progress (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
  /elections/latest:
    get:
      operationId: getLatestElection
      summary: Read the active school's election in progress, or else its most recently created one
      description: >
        Any member of the active school. The election in progress when there is one (the same as
        `GET /elections/current`); otherwise the most recently created election, so everyone still sees an annulled
        election and its reason. Responses carry `Cache-Control: no-store`.
      responses:
        "200":
          description: The election.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The account has no membership in the active school (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: The school has no election (`not_found`).
          content:
