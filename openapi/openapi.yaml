  /elections/{electionId}/vote:
    parameters:
      - name: electionId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: postElectionVote
      summary: Cast a secret ballot
      description: >
        A student of the election's Electorate (the whole roster of the school when voting opened) votes once,
        for an approved list of the election or blank, while voting is open: from `startsAt` (inclusive) until
        `endsAt` (exclusive). The Voter registry and the Ballot are written in one transaction; the Ballot keeps
        no link to the voter, and nothing about the choice is logged. No second factor is needed beyond what the
        session already requires. Checks, in order: `unauthenticated`, `not_found` (election or list unknown in
        the active school, whether or not it exists in another), `forbidden` (no membership), `election_annulled`,
        `election_not_open`, `no_approved_lists`, `not_in_electorate` (no roster entry, or added to the roster
        after voting opened), `invalid_choice`, `already_voted`. Every error writes nothing; retrying a vote that
        was stored answers `already_voted`. Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "204":
          description: The vote was stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            `forbidden` (no membership in the active school) or `not_in_electorate` (the account is not linked to a
            student of the Electorate: a school admin or officer without a roster entry, or a student added to the
            roster after voting opened).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [forbidden, not_in_electorate]
        "404":
          description: No such election, or no such list, in the active school (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: >
            Nothing was written. `election_annulled` (the election was annulled), `election_not_open` (before
            `startsAt` or from `endsAt` on), `no_approved_lists` (no list was approved, so voting never opens) or
            `already_voted` (this student already voted).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [election_annulled, election_not_open, no_approved_lists, already_voted]
        "422":
          description: >
            Nothing was written. `invalid_choice`: `choice` missing, null or empty, neither `blank` nor a list id,
            or a list of the election that is not approved (pending or rejected) or a list of another election.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [invalid_choice]
