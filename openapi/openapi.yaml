openapi: 3.0.3
info:
  title: Centro de Estudiantes API
  version: 0.1.0
  description: Contract shared by the Go API (api/) and the web client (web/). Edit this file first, then regenerate both sides.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Sign in with email and password
      description: >
        On success sets the session cookie `__Host-session` (HttpOnly, Secure, SameSite=Lax, Path=/,
        12 hours). Unknown email and wrong password get the same 401 body. Failed attempts are limited
        per client IP and per email (5 per 15 minutes); further attempts get 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          description: The body is not a valid login request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong email or password (always `invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts (`too_many_attempts`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Sign out
      description: Deletes the current session, if any, and expires the cookie.
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Current user
      responses:
        "200":
          description: The signed-in user and the active tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/claim:
    post:
      operationId: postAuthClaim
      summary: Create an account with a school access code
      description: >
        No session needed. Creates the user, a `student` membership linked to the code's roster member,
        consumes the code and signs in (cookie as in login). Inputs are validated before any lookup:
        email (at most 254 characters, stored lowercase), password (10 to 128 characters) and code
        (12 Crockford base32 characters; case, spaces and hyphens are ignored). Unknown, used, revoked,
        expired and already-linked codes all get the same `invalid_code`. Every `invalid_code` counts
        against a per-IP limit (10 per 15 minutes); further requests get 429. Responses carry
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "201":
          description: Account created and signed in; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: >
            An account with this email exists (`email_in_use`); nothing changed and the code stays usable.
            Sign in and use `/auth/redeem` instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`invalid_email`, `weak_password` or `invalid_code`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/redeem:
    post:
      operationId: postAuthRedeem
      summary: Add a school to the signed-in account with an access code
      description: >
        Adds a `student` membership in the code's tenant linked to its roster member, consumes the code
        and makes that tenant the session's active tenant. Same code rules and rate limit as `/auth/claim`.
        Responses carry `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: Membership added; the session now points at the code's tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: The user already belongs to the code's tenant (`already_member`); the code stays usable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`invalid_code`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /roster:
    get:
      operationId: getRoster
      summary: List the roster of the active tenant
      description: "School admins only. Responses carry `Cache-Control: no-store` (personal data)."
      responses:
        "200":
          description: Roster members ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /roster/import:
    post:
      operationId: postRosterImport
      summary: Import roster members from CSV
      description: >
        School admins only. The body is CSV (max 1 MiB, max 5000 data rows) whose first line is the
        header `full_name,document_number` (case-insensitive, trimmed). `document_number` must have 7 to 9
        digits after removing dots and spaces. The import is atomic: any invalid row or a document number
        repeated in the file writes nothing. Rows whose document number already exists in the tenant are
        skipped, never updated.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "200":
          description: Imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Body larger than 1 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type is not `text/csv` (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Nothing was written. `invalid_rows` lists every problem with its 1-based line number (the header
            is line 1); `too_many_rows` when the file has more than 5000 data rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
  /roster/{memberId}/access-code:
    post:
      operationId: postRosterMemberAccessCode
      summary: Issue an access code for one roster member
      description: >
        School admins only. Returns the code in plain text once (`Cache-Control: no-store`); only its HMAC is
        stored. The code expires after 30 days and revokes the member's previous unused code.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Code issued.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such member in the active tenant (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The member already has an account (`member_has_account`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /roster/access-codes:
    post:
      operationId: postRosterAccessCodes
      summary: Issue codes for every member without an account and without an active code
      description: "School admins only. Codes are shown once, for printing (`Cache-Control: no-store`)."
      responses:
        "201":
          description: Codes issued, ordered by name; empty when nobody needed one.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssuedMemberCode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  responses:
    BadRequest:
      description: Body is not JSON, has unknown fields or trailing data, or exceeds 4 KiB (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: Too many invalid codes from this client (`too_many_attempts`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The user is not a school admin of the active tenant (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ClaimRequest:
      type: object
      required: [code, email, password]
      additionalProperties: false
      properties:
        code:
          type: string
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    RedeemRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    Role:
      type: string
      enum: [school_admin, officer, student]
    Me:
      type: object
      required: [userId, email, tenantId, role]
      properties:
        userId:
          type: string
        email:
          type: string
        tenantId:
          type: string
          nullable: true
          description: Active tenant of the session; null when the user has no membership.
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
          description: Role in the active tenant; null when the user has no membership.
    RosterMember:
      type: object
      required: [id, fullName, documentNumber, hasActiveCode, hasAccount]
      properties:
        id:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        hasActiveCode:
          type: boolean
          description: An unused, unrevoked and unexpired access code exists.
        hasAccount:
          type: boolean
    ImportResult:
      type: object
      required: [inserted, skipped]
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
    ImportError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
    RowError:
      type: object
      required: [line, reason]
      properties:
        line:
          type: integer
        reason:
          type: string
    IssuedCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$"
        expiresAt:
          type: string
          format: date-time
    IssuedMemberCode:
      type: object
      required: [memberId, fullName, documentNumber, code, expiresAt]
      properties:
        memberId:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
