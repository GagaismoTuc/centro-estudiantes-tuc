              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: The votes per list are not available (`results_not_available`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [results_not_available]
