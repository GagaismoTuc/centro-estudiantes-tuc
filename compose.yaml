# Development services. Copy the example env file to .env and set POSTGRES_PASSWORD first.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: centro
      POSTGRES_USER: centro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centro -d centro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
