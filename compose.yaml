# Development services. Copy the example env file to .env and set POSTGRES_PASSWORD first.
services:
  gotenberg:
    image: gotenberg/gotenberg:9.9.0@sha256:2f4945f698c3d02f691a27d56bb8e7ba4585e6ab50bd233329a36eb0423ae587

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: centro
      POSTGRES_USER: centro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centro -d centro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
